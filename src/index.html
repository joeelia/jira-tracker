<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jira Worker Analytics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .header p {
      opacity: 0.9;
      font-size: 1.1rem;
    }

    .search-box {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
    }

    .search-form {
      display: flex;
      gap: 1rem;
    }

    .search-form input {
      flex: 1;
      padding: 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .search-form input:focus {
      outline: none;
      border-color: #667eea;
    }

    .search-form button {
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .search-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .search-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }

    .error.show {
      display: block;
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 1.2rem;
      display: none;
    }

    .loading.show {
      display: block;
    }

    .results {
      display: none;
    }

    .results.show {
      display: block;
    }

    .user-info {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
    }

    .user-info h2 {
      color: #1a202c;
      margin-bottom: 1rem;
    }

    .user-info .email {
      color: #718096;
      font-size: 1.1rem;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .metric-card .value {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .metric-card .label {
      color: #718096;
      font-size: 1rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tickets-section {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .tickets-section h2 {
      color: #1a202c;
      margin-bottom: 1.5rem;
    }

    .tickets-table {
      width: 100%;
      border-collapse: collapse;
    }

    .tickets-table th,
    .tickets-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    .tickets-table th {
      background: #f7fafc;
      color: #4a5568;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
    }

    .tickets-table tr:hover {
      background: #f7fafc;
    }

    .ticket-key {
      color: #667eea;
      font-weight: 600;
    }

    .ticket-summary {
      color: #2d3748;
    }

    .ticket-hours {
      color: #48bb78;
      font-weight: 600;
    }

    .ticket-points {
      color: #ed8936;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: white;
      opacity: 0.8;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Jira Worker Analytics</h1>
      <p>Search for a user to view their work metrics</p>
    </div>

    <div class="search-box">
      <div class="error" id="error"></div>
      <form class="search-form" id="searchForm">
        <input 
          type="email" 
          id="emailInput" 
          placeholder="Enter user email (e.g., user@example.com)" 
          required
        >
        <button type="submit" id="searchButton">Search</button>
      </form>
    </div>

    <div class="loading" id="loading">Loading...</div>

    <div class="results" id="results">
      <div class="user-info" id="userInfo">
        <h2 id="userName"></h2>
        <p class="email" id="userEmail"></p>
      </div>

      <div class="metrics">
        <div class="metric-card">
          <div class="value" id="totalTickets">0</div>
          <div class="label">Total Tickets</div>
        </div>
        <div class="metric-card">
          <div class="value" id="totalHours">0</div>
          <div class="label">Total Hours</div>
        </div>
      </div>

      <div class="tickets-section">
        <h2>Tickets</h2>
        <table class="tickets-table">
          <thead>
            <tr>
              <th>Key</th>
              <th>Summary</th>
              <th>Story Points</th>
              <th>Hours</th>
              <th>Comments</th>
              <th>Created</th>
              <th>First In Progress</th>
              <th>Closed</th>
            </tr>
          </thead>
          <tbody id="ticketsTableBody">
          </tbody>
        </table>
      </div>
    </div>

    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <p>Enter an email address to search for a user</p>
    </div>
  </div>

  <script>
    const searchForm = document.getElementById('searchForm');
    const emailInput = document.getElementById('emailInput');
    const searchButton = document.getElementById('searchButton');
    const error = document.getElementById('error');
    const loading = document.getElementById('loading');
    const results = document.getElementById('results');
    const emptyState = document.getElementById('emptyState');
    const userName = document.getElementById('userName');
    const userEmail = document.getElementById('userEmail');
    const totalTickets = document.getElementById('totalTickets');
    const totalHours = document.getElementById('totalHours');
    const ticketsTableBody = document.getElementById('ticketsTableBody');

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      
      if (!email) return;

      error.classList.remove('show');
      results.classList.remove('show');
      emptyState.classList.add('show');
      loading.classList.add('show');
      searchButton.disabled = true;

      try {
        const response = await fetch(`/metrics?email=${encodeURIComponent(email)}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to fetch metrics');
        }

        userName.textContent = data.user.displayName;
        userEmail.textContent = email;
        totalTickets.textContent = data.totalTickets;
        totalHours.textContent = data.totalHours;

        ticketsTableBody.innerHTML = data.tickets.map(ticket => `
          <tr>
            <td><span class="ticket-key">${ticket.key}</span></td>
            <td class="ticket-summary">${ticket.summary}</td>
            <td class="ticket-points">${ticket.storyPoints || '-'}</td>
            <td class="ticket-hours">${ticket.userHours}h</td>
            <td>${ticket.comments}</td>
            <td>${formatDate(ticket.created)}</td>
            <td>${ticket.firstInProgress ? formatDate(ticket.firstInProgress) : '-'}</td>
            <td>${ticket.closedDate ? formatDate(ticket.closedDate) : '-'}</td>
          </tr>
        `).join('');

        emptyState.classList.remove('show');
        results.classList.add('show');
      } catch (err) {
        error.textContent = err.message;
        error.classList.add('show');
      } finally {
        loading.classList.remove('show');
        searchButton.disabled = false;
      }
    });

    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }
  </script>
</body>
</html>
